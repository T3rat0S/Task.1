 <!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Регистрация студента</title><link rel="stylesheet" href="style.css"></head><body>
<main class="card"><h1>Регистрация студента</h1>
<form id="studentForm">
<label>ФИО<input id="name" placeholder="Иванов Иван Иванович" required></label>
<label>Email<input id="email" type="email" placeholder="student@mail.com" required></label>
<label>Возраст<input id="age" type="number" min="14" max="100" required></label>
<label>Учебная группа<input id="group" placeholder="РПО-25-2" required></label>
<label>Телефон<input id="phone" type="tel" placeholder="+7 700 123 45 67" required></label>
<button type="submit">Зарегистрироваться</button></form><p id="result" aria-live="polite"></p></main><script src="script.js"></script></body>
<body>
    <main class="card">
    <h1>Калькулятор стоимости заказа</h1>
<form id="orderForm"><label>Цена одного товара (₸)<input id="price" type="number" min="0" step="0.01" required></label>
    <label>Количество<input id="quantity" type="number" min="1" step="1" value="1" required></label>
    <button>Рассчитать</button></form><p id="result"></p><small>При сумме от 50 000 ₸ автоматически применяется скидка 10%.</small></main>

</body>
<body><main class="card"><h1>Проверка сложности пароля</h1>
<label>Пароль<input id="password" type="password" placeholder="Введите пароль"></label><button id="toggle" type="button">Показать пароль</button><div class="bar"><div id="strengthBar"></div></div><h3 id="strength">Введите пароль</h3><ul id="checks"><li>Не менее 8 символов</li><li>Есть буквы и цифры</li><li>Есть специальный символ</li></ul></main><script src="script.js"></script></body>
<body><main class="card"><h1>Выбор специальности и группы</h1><label>Специальность<select id="specialty"><option value="">Выберите специальность</option><option value="software">Разработка программного обеспечения</option><option value="design">Дизайн</option></select></label><label>Учебная группа<select id="group" disabled><option value="">Сначала выберите специальность</option></select></label><label>Студент<select id="student" disabled><option value="">Сначала выберите группу</option></select></label><p id="result"></p></main><script src="script.js"></script></body>
<body><main class="card wide"><h1>Каталог товаров</h1><div class="row"><label>Категория<select id="category"><option value="all">Все категории</option><option value="Ноутбуки">Ноутбуки</option><option value="Телефоны">Телефоны</option><option value="Планшеты">Планшеты</option></select></label><label>Цена<select id="range"><option value="all">Любая цена</option><option value="low">До 100 000 ₸</option><option value="mid">100 000–300 000 ₸</option><option value="high">От 300 000 ₸</option></select></label><label>Сортировка<select id="sort"><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select></label></div><div id="products" class="products"></div></main><script src="script.js"></script></body>
<body><main class="card center"><h1>Секундомер</h1><div id="time" class="time">00:00</div><div class="row"><button id="start">Старт</button><button id="stop">Стоп</button><button id="reset">Сброс</button></div></main><script src="script.js"></script></body>
